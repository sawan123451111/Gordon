<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000">
  <defs>
    <radialGradient id="bgSPF" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#332b1e"/>
      <stop offset="55%" stop-color="#17130d"/>
      <stop offset="100%" stop-color="#0a0704"/>
    </radialGradient>
    <linearGradient id="tubeSPF" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c9c1b1"/>
      <stop offset="45%" stop-color="#f4efe4"/>
      <stop offset="55%" stop-color="#f4efe4"/>
      <stop offset="100%" stop-color="#b7ae9b"/>
    </linearGradient>
    <linearGradient id="bandSPF" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8a6a2a"/>
      <stop offset="50%" stop-color="#e9cd82"/>
      <stop offset="100%" stop-color="#7a5a1f"/>
    </linearGradient>
  </defs>
  <rect width="800" height="1000" fill="url(#bgSPF)"/>
  <circle cx="600" cy="200" r="220" fill="#caa963" opacity="0.08"/>
  <ellipse cx="400" cy="860" rx="140" ry="26" fill="#000" opacity="0.35"/>
  <!-- tube nozzle -->
  <path d="M356 120 h88 l-10 42 h-68 z" fill="url(#tubeSPF)"/>
  <rect x="350" y="160" width="100" height="18" rx="4" fill="url(#tubeSPF)" stroke="#a89f8c" stroke-width="1"/>
  <!-- tube body -->
  <path d="M330 178 h140 v560 a70 70 0 0 1 -140 0 z" fill="url(#tubeSPF)"/>
  <rect x="330" y="178" width="14" height="560" fill="#ffffff" opacity="0.5"/>
  <!-- gold band -->
  <rect x="322" y="700" width="156" height="20" fill="url(#bandSPF)"/>
  <text x="400" y="330" text-anchor="middle" font-family="Georgia, serif" font-size="30" letter-spacing="6" fill="#8a6a2a">V</text>
  <text x="400" y="380" text-anchor="middle" font-family="Georgia, serif" font-size="26" letter-spacing="3" fill="#2a2418">VESPER</text>
  <text x="400" y="470" text-anchor="middle" font-family="Georgia, serif" font-size="15" letter-spacing="2" fill="#4a4230">DAILY SPF 50</text>
  <text x="400" y="494" text-anchor="middle" font-family="Georgia, serif" font-size="15" letter-spacing="2" fill="#4a4230">SUNSCREEN. PA+++.</text>
  <text x="400" y="530" text-anchor="middle" font-family="Georgia, serif" font-size="12" letter-spacing="1" fill="#6a624c">Broad Spectrum</text>
</svg>
